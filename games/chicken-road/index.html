<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1318" />
  <title>Chicken Road</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" />
</head>
<body>
  <main id="app">
    <header class="bar">
      <h1>Chicken Road</h1>
      <div class="wallet" aria-label="Play money balance"><span class="coin" aria-hidden="true"></span><b id="balance">10,000.00</b></div>
    </header>

    <section id="stage" aria-label="Road"></section>

    <section class="panel" aria-live="polite">
      <div class="status" id="status">
        <span id="statusMain">Pick a difficulty and place your bet</span>
        <span id="statusSub"></span>
      </div>

      <div id="setup">
        <div class="seg" role="radiogroup" aria-label="Difficulty" id="difficulty">
          <button type="button" role="radio" data-d="easy" aria-checked="false">Easy</button>
          <button type="button" role="radio" data-d="medium" aria-checked="true">Medium</button>
          <button type="button" role="radio" data-d="hard" aria-checked="false">Hard</button>
          <button type="button" role="radio" data-d="daredevil" aria-checked="false">Daredevil</button>
        </div>
        <div class="bet">
          <button type="button" class="step" id="betMinus" aria-label="Lower bet">−</button>
          <input id="betInput" inputmode="decimal" value="100" aria-label="Bet amount" />
          <button type="button" class="step" id="betPlus" aria-label="Raise bet">+</button>
        </div>
        <div class="chips" id="chips">
          <button type="button" data-v="10">10</button><button type="button" data-v="50">50</button>
          <button type="button" data-v="100">100</button><button type="button" data-v="500">500</button>
          <button type="button" data-v="1000">1000</button>
        </div>
        <button type="button" class="cta play" id="play">Play</button>
        <button type="button" class="cta ghost" id="reset" hidden>Refill play money</button>
      </div>

      <div id="run" hidden>
        <button type="button" class="cta go" id="cross">Cross</button>
        <button type="button" class="cta cash" id="cash" disabled><span>Cash out</span><b id="cashAmt"></b></button>
      </div>
      <p class="foot" id="foot">Play money only. Math: <span id="mathSrc">loading…</span></p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
